<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal Fontconfig config bundled with PDForge.app.

  WeasyPrint's bundled Pango/Fontconfig dylibs need *some* fontconfig
  config to find fonts at runtime. Rather than ship our own fonts, point
  fontconfig at the font directories that exist on every Mac, and use a
  per-user cache dir so it can write its font cache without touching the
  read-only app bundle.
-->
<fontconfig>
    <dir>/System/Library/Fonts</dir>
    <dir>/Library/Fonts</dir>
    <dir>~/Library/Fonts</dir>

    <cachedir>~/Library/Application Support/PDForge/fontconfig-cache</cachedir>
</fontconfig>
