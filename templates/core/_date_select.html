<div style="display:flex;gap:6px;">
  <select name="{{ field_name }}_day" class="form-input" style="flex:0.8">
    <option value="">Ден</option>
    {% for d in days %}
    <option value="{{ d|stringformat:'02d' }}" {% if d == sel_day %}selected{% endif %}>{{ d }}</option>
    {% endfor %}
  </select>
  <select name="{{ field_name }}_month" class="form-input" style="flex:1.4">
    <option value="">Месец</option>
    {% for num, label in months %}
    <option value="{{ num|stringformat:'02d' }}" {% if num == sel_month %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  <select name="{{ field_name }}_year" class="form-input" style="flex:1">
    <option value="">Година</option>
    {% for y in years %}
    <option value="{{ y }}" {% if y == sel_year %}selected{% endif %}>{{ y }}</option>
    {% endfor %}
  </select>
</div>
