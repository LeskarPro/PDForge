{% for tag in tags %}
<div class="tag-row {% if tag.site_count == 0 and tag.protocol_count == 0 %}tag-row--unused{% endif %}"
     data-id="{{ tag.pk }}">
  <span class="drag-handle" title="Преместване">⠿</span>
  <span class="tag-pill" style="background:{{ tag.color }}22; color:{{ tag.color }};">
    <span class="tag-pill-dot" style="background:{{ tag.color }};"></span>
    {{ tag.name }}
  </span>
  {% if tag.description %}
    <span class="tag-description">{{ tag.description }}</span>
  {% else %}
    <span class="tag-description empty">— без описание —</span>
  {% endif %}
  <div class="row-actions">
    <button class="row-btn" title="Редактирай"
            hx-get="{% url 'core:tag_edit' tag.pk %}"
            hx-target="#modal-content"
            hx-swap="innerHTML">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.862 4.487l1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 7.125L17.25 4.875"/>
      </svg>
    </button>
    <button class="row-btn del" title="Изтрий"
            hx-get="{% url 'core:tag_delete_confirm' tag.pk %}"
            hx-target="#modal-content"
            hx-swap="innerHTML">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
      </svg>
    </button>
  </div>
</div>
{% empty %}
<div class="empty-state">
  <p>Няма добавени етикети. Натисни „Нов етикет", за да създадеш първия.</p>
</div>
{% endfor %}
