<style>
  .ff-bc{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);margin-bottom:10px}
  .ff-crumb{cursor:pointer;padding:2px 6px;border-radius:3px;background:var(--content-bg);color:var(--text-primary)}
  .ff-crumb:hover{background:rgba(255,166,134,.18)}
  .ff-sep{color:var(--text-muted)}
  .ff-folder-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto}
  .ff-folder-row{padding:8px 12px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:background .12s,border-color .12s}
  .ff-folder-row:hover{background:rgba(255,166,134,.10);border-color:var(--c-clay)}
  .ff-empty{font-size:12px;color:var(--text-muted);font-style:italic;padding:8px 0}
  .ff-selected-note{font-size:11.5px;color:var(--text-muted);margin-top:8px;padding:6px 10px;background:rgba(214,161,132,.1);border-radius:var(--radius-sm)}
</style>

<script id="ff-data" type="application/json">{{ folders_json|safe }}</script>

<div style="color:var(--text-primary)">
  <div class="modal-title" style="font-size:16px;font-weight:700;padding:20px 24px 0;margin-bottom:18px;">
    {% if folder %}Редактирай папка{% else %}Нова папка{% endif %}
  </div>

  <div class="form-section-label">Информация</div>
  <div class="form-inner" style="margin-bottom:4px">
    <div style="margin-bottom:14px">
      <label class="form-label">Име на папката <span class="req">*</span></label>
      <input class="form-input" type="text" id="ff-name"
             placeholder="напр. Виктория Нутс"
             value="{{ folder.name|default:'' }}">
      <div id="ff-err" style="color:#c0392b;font-size:12px;margin-top:5px;display:none"></div>
    </div>
  </div>

  <div class="form-section-label">Местоположение</div>
  <div class="form-inner" style="margin-bottom:4px">
    <div class="ff-bc" id="ff-bc"></div>
    <div class="ff-folder-list" id="ff-list"></div>
    <div class="ff-selected-note" id="ff-note"></div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn-cancel" onclick="closeModal()">Отказ</button>
    <button type="button" class="btn-save" id="ff-submit">Запази</button>
  </div>
</div>

<script>
(function() {
  const allFolders = JSON.parse(document.getElementById('ff-data').textContent);
  const selfId     = '{{ folder.pk|default:"" }}';
  const initParent = '{{ folder.parent_id|default:"" }}' || null;
  const submitUrl  = '{% if folder %}{% url "core:folder_edit" folder.pk %}{% else %}{% url "core:folder_create" %}{% endif %}';

  // Exclude self from the picker to prevent cycles
  const folders = allFolders.filter(f => String(f.id) !== selfId);

  let currentId = initParent;

  function subfolders(parentId) {
    return folders.filter(f => String(f.parent_id || '') === String(parentId || ''));
  }

  function breadcrumbFor(folderId) {
    if (!folderId) return [];
    const trail = [];
    let cursor = folders.find(f => String(f.id) === String(folderId));
    const seen = new Set();
    while (cursor && !seen.has(cursor.id)) {
      trail.unshift(cursor);
      seen.add(cursor.id);
      cursor = cursor.parent_id
        ? folders.find(f => String(f.id) === String(cursor.parent_id))
        : null;
    }
    return trail;
  }

  function render() {
    // Breadcrumb
    const bc = document.getElementById('ff-bc');
    const trail = breadcrumbFor(currentId);
    let bcHtml = '<span class="ff-crumb" data-nav="null">Шаблони</span>';
    trail.forEach(c => {
      bcHtml += `<span class="ff-sep">›</span>
        <span class="ff-crumb" data-nav="${c.id}">${c.name}</span>`;
    });
    bc.innerHTML = bcHtml;
    bc.querySelectorAll('.ff-crumb').forEach(el => {
      el.addEventListener('click', () => {
        currentId = el.dataset.nav === 'null' ? null : el.dataset.nav;
        render();
      });
    });

    // Subfolder list
    const list = document.getElementById('ff-list');
    const subs = subfolders(currentId);
    if (subs.length === 0) {
      list.innerHTML = '<div class="ff-empty">Тази папка няма подпапки — ще бъде запазена тук.</div>';
    } else {
      list.innerHTML = subs.map(f =>
        `<div class="ff-folder-row" data-id="${f.id}">📁 ${f.name}</div>`
      ).join('');
      list.querySelectorAll('.ff-folder-row').forEach(el => {
        el.addEventListener('click', () => {
          currentId = el.dataset.id;
          render();
        });
      });
    }

    // Selected note
    const note = document.getElementById('ff-note');
    if (currentId) {
      const f = folders.find(x => String(x.id) === String(currentId));
      note.textContent = f ? `Ще бъде запазена в: ${f.name}` : '';
    } else {
      note.textContent = 'Ще бъде запазена в: Шаблони (корен)';
    }
  }

  render();

  document.getElementById('ff-submit').addEventListener('click', async function() {
    const name = document.getElementById('ff-name').value.trim();
    const err  = document.getElementById('ff-err');
    if (!name) {
      err.textContent = 'Името е задължително.';
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';
    const form = new FormData();
    form.append('name', name);
    if (currentId) form.append('parent_id', currentId);
    const csrf = document.querySelector('[name=csrfmiddlewaretoken]');
    if (csrf) form.append('csrfmiddlewaretoken', csrf.value);

    const r = await fetch(submitUrl, { method: 'POST', body: form });
    if (r.ok) {
      document.body.dispatchEvent(new Event('foldersChanged'));
    } else {
      const data = await r.json().catch(() => ({}));
      err.textContent = data.error || 'Грешка при запазване.';
      err.style.display = 'block';
    }
  });
})();
</script>
