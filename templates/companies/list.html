{% extends "base.html" %}

{% block title %}Лични данни — PDForge{% endblock %}
{% block topbar_title %}Лични данни{% endblock %}

{% block topbar_actions %}
  <button class="btn-primary"
          hx-get="{% url 'core:company_create' %}"
          hx-target="#modal-content"
          hx-swap="innerHTML">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="none"
         viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
    </svg>
    Нова фирма
  </button>
{% endblock %}

{% block content %}
<style>
  /* Card grid */
  .company-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    align-items: start;
  }

  .company-card {
    background: #fff;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 20px 18px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    position: relative;
    transition: box-shadow var(--t-fast);
    cursor: default;
  }
  .company-card:hover { box-shadow: 0 4px 18px rgba(61,43,47,.10); }
  .company-card.is-default {
    border-color: var(--c-coral);
    box-shadow: 0 0 0 2px rgba(192,83,58,.15);
  }
  .company-card.sortable-ghost { opacity: .35; }
  .company-card.sortable-chosen { box-shadow: 0 8px 32px rgba(61,43,47,.18); }

  /* Drag handle */
  .card-drag-handle {
    position: absolute;
    top: 10px; left: 10px;
    width: 20px; height: 20px;
    color: var(--border-subtle);
    cursor: grab;
    transition: color var(--t-fast);
  }
  .card-drag-handle:active { cursor: grabbing; }
  .card-drag-handle svg { width: 16px; height: 16px; }
  .company-card:hover .card-drag-handle { color: var(--text-muted); }

  /* Action buttons (top right) */
  .card-actions {
    position: absolute;
    top: 10px; right: 10px;
    display: flex; gap: 4px;
  }
  .site-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: var(--radius-sm);
    color: var(--text-muted); border: 1px solid transparent;
    transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
  }
  .site-btn svg { width: 13px; height: 13px; }
  .site-btn:hover { background: var(--content-bg); border-color: var(--border-subtle); color: var(--text-primary); }
  .site-btn.edit:hover { color: #b05030; background: rgba(255,166,134,.1); border-color: rgba(255,166,134,.3); }
  .site-btn.del:hover  { color: #b03030; background: rgba(200,80,80,.08); border-color: rgba(200,80,80,.25); }

  /* Logo */
  .card-logo-wrap {
    width: 80px; height: 80px;
    border-radius: 50%;
    overflow: hidden;
    margin: 14px 0 12px;
    border: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: center;
    background: #fdf9f6;
    flex-shrink: 0;
  }
  .card-logo-img { width: 100%; height: 100%; object-fit: contain; }
  .card-logo-initials {
    font-size: 26px; font-weight: 700;
    color: var(--c-coral); letter-spacing: .02em;
  }

  /* Default badge */
  .card-default-badge {
    display: inline-block;
    background: rgba(192,83,58,.10);
    color: #993c1d;
    font-size: 10.5px; font-weight: 600;
    padding: 2px 10px; border-radius: 10px;
    margin-bottom: 8px;
    letter-spacing: .04em;
  }

  /* Name + slogan */
  .card-name {
    font-size: 15px; font-weight: 700;
    color: var(--text-primary);
    text-align: center; margin-bottom: 4px;
  }
  .card-slogan {
    font-size: 11.5px; font-style: italic;
    color: var(--text-muted);
    text-align: center; margin-bottom: 12px;
  }

  /* Info rows */
  .card-info {
    width: 100%;
    border-top: 1px solid var(--border-subtle);
    padding-top: 10px; margin-top: 4px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .card-info-row { display: flex; gap: 6px; font-size: 12.5px; }
  .card-info-label { color: var(--text-muted); min-width: 38px; flex-shrink: 0; }
  .card-info-val { color: var(--text-primary); }

  /* Set default button */
  .card-set-default-btn {
    margin-top: 14px;
    width: 100%;
    padding: 7px 0;
    font-size: 12.5px; font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--t-fast);
  }
  .card-set-default-btn:hover {
    color: #993c1d;
    border-color: rgba(192,83,58,.4);
    background: rgba(192,83,58,.05);
  }

  .no-companies {
    color: var(--text-muted); font-style: italic; font-size: 13px;
    padding: 40px 0;
  }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(61,43,47,.38);
    display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal-overlay.hidden { display: none; }
  .modal-box { background: #fff; border-radius: var(--radius-lg);
    width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,.18); }

  /* Form */
  .modal-title { font-size: 16px; font-weight: 700; color: var(--text-primary);
    padding: 20px 24px 0; margin-bottom: 18px; }
  .form-section-label { font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--text-muted);
    padding: 6px 24px; background: #fdf9f6;
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle); margin-bottom: 16px; }
  .form-inner { padding: 0 24px; }
  .form-row { display: grid; gap: 12px; margin-bottom: 14px; }
  .form-row.cols2 { grid-template-columns: 1fr 1fr; }
  .form-row.cols1 { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--text-muted); margin-bottom: 5px; }
  .form-label .req { color: var(--c-coral); }
  .form-input { width: 100%; padding: 9px 12px; border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm); font: inherit; font-size: 13.5px;
    color: var(--text-primary); background: #fff; outline: none;
    transition: border-color var(--t-fast); }
  .form-input:focus { border-color: var(--c-clay); }
  .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .form-error { color: #c0392b; font-size: 11.5px; margin-top: 4px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 8px;
    margin: 18px 24px 20px; border-top: 1px solid var(--border-subtle); padding-top: 16px; }
  .btn-cancel { padding: 8px 18px; font-size: 13px; color: var(--text-muted);
    border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
    background: #fff; }
  .btn-cancel:hover { background: var(--content-bg); color: var(--text-primary); }
  .btn-save { padding: 8px 20px; font-size: 13px; font-weight: 500;
    background: var(--c-coral); color: #fff; border-radius: var(--radius-sm); }
  .btn-save:hover { background: #f09070; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px;
    color: var(--text-primary); cursor: pointer; }
  .checkbox-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--c-coral); }
</style>

<!-- Modal -->
<div id="modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div id="modal-content"
         hx-on::after-swap="document.getElementById('modal').classList.remove('hidden')">
    </div>
  </div>
</div>

<!-- Card grid -->
<div id="company-grid" class="company-grid">
  {% include "companies/_cards.html" %}
</div>

{% endblock %}

{% block extra_scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
  document.addEventListener('htmx:configRequest', function(e) {
    e.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
  });

  function closeModal() {
    document.getElementById('modal').classList.add('hidden');
    document.getElementById('modal-content').innerHTML = '';
  }
  document.body.addEventListener('closeModal', closeModal);

  document.body.addEventListener('companiesChanged', function() {
    closeModal();
    htmx.ajax('GET', '{% url "core:company_cards" %}', {
      target: '#company-grid', swap: 'innerHTML'
    });
  });

  function initSortable() {
    const grid = document.getElementById('company-grid');
    if (!grid || !window.Sortable) return;
    Sortable.create(grid, {
      handle: '.card-drag-handle',
      animation: 150,
      ghostClass: 'sortable-ghost',
      chosenClass: 'sortable-chosen',
      onEnd: function() {
        const ids = [...grid.querySelectorAll('.company-card')].map(el => el.dataset.id);
        const form = new FormData();
        ids.forEach(id => form.append('order[]', id));
        form.append('csrfmiddlewaretoken', '{{ csrf_token }}');
        fetch('{% url "core:company_reorder" %}', { method: 'POST', body: form });
      },
    });
  }

  // Init on page load and after HTMX swaps regenerate the grid
  initSortable();
  document.body.addEventListener('htmx:afterSwap', function(e) {
    if (e.detail.target.id === 'company-grid') initSortable();
  });
</script>
{% endblock %}
