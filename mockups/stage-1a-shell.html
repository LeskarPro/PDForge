<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDForge — Stage 1a Mockup</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    /* ─── CSS CUSTOM PROPERTIES (all colors live here — never hardcode hex elsewhere) ─── */
    :root {
      /* Brand palette */
      --c-peach:  #fec196;
      --c-coral:  #ffa686;
      --c-clay:   #d6a184;
      --c-mauve:  #aa767c;
      --c-plum:   #63474d;

      /* Sidebar */
      --sidebar-width:        240px;
      --sidebar-bg:           var(--c-plum);       /* #63474d */
      --sidebar-brand-bg:     #4a343a;              /* darker band — Block A */

      /* Nav item states */
      --nav-text:             rgba(255, 255, 255, 0.82);
      --nav-text-hover:       rgba(255, 255, 255, 0.97);
      --nav-text-active:      var(--c-peach);       /* #fec196 */
      --nav-bg-hover:         #74565c;
      --nav-bg-active:        #7d5f66;
      --nav-accent-active:    var(--c-coral);       /* #ffa686 — left border */

      /* Sub-items (Справочници children) */
      --nav-sub-bg:           #4a343a;
      --nav-sub-text:         rgba(255, 255, 255, 0.68);
      --nav-sub-text-hover:   rgba(255, 255, 255, 0.92);
      --nav-sub-bg-hover:     #574048;

      /* Section label (Управление) */
      --nav-label-text:       rgba(255, 255, 255, 0.35);

      /* Version */
      --version-text:         #7d5f66;

      /* Content area */
      --content-bg:           #f6efe9;
      --card-bg:              #ffffff;
      --text-primary:         #3d2b2f;
      --text-muted:           #9a7a80;

      /* Borders & radius — minimal rounding */
      --radius-xs:  3px;
      --radius-sm:  4px;
      --radius-md:  6px;
      --radius-lg:  8px;

      /* Transitions */
      --t-fast: 140ms ease;
      --t-med:  200ms ease;
    }

    /* ─── RESET ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    a { text-decoration: none; cursor: pointer; }
    button { border: none; background: none; cursor: pointer; font: inherit; }

    /* ─── APP LAYOUT: sidebar + content ─── */
    .app-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ══════════════════════════════════════
       SIDEBAR
    ══════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Block A: Branding ── */
    .sidebar-brand {
      background: var(--sidebar-brand-bg);
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }
    .brand-appname {
      font-size: 17px;
      font-weight: 700;
      color: var(--c-peach);
      letter-spacing: 0.01em;
    }
    .brand-company {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Block B: Main navigation ── */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      scrollbar-width: thin;
      scrollbar-color: #7d5f66 transparent;
    }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: #7d5f66; border-radius: var(--radius-sm); }

    /* ── Block C: Management ── */
    .sidebar-management {
      flex-shrink: 0;
      padding: 6px 0 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ── Block D: Version ── */
    .sidebar-version {
      flex-shrink: 0;
      padding: 8px 16px 12px;
      font-size: 11px;
      color: var(--version-text);
      letter-spacing: 0.03em;
    }

    /* ── Generic nav item ── */
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;                           /* gap only shows when icon is present */
      padding: 9px 16px;
      color: var(--nav-text);
      border-left: 3px solid transparent;  /* reserve space to avoid layout shift on active */
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
      user-select: none;
    }
    .nav-item:hover {
      background: var(--nav-bg-hover);
      color: var(--nav-text-hover);
    }
    .nav-item:active {
      background: var(--nav-bg-active);
    }
    .nav-item.active {
      background: var(--nav-bg-active);
      color: var(--nav-text-active);
      border-left-color: var(--nav-accent-active);
      font-weight: 500;
    }
    .nav-text {
      flex: 1;
      font-size: 13.5px;
      line-height: 1.3;
    }

    /* ── Icon slot (when icons are added) ──
       Usage: <a class="nav-item"><svg class="nav-icon">…</svg><span class="nav-text">…</span></a>
       Without the SVG, gap: 10px has no effect — text stays left-aligned naturally. */
    .nav-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.82;
    }
    .nav-item:hover .nav-icon,
    .nav-item.active .nav-icon { opacity: 1; }

    /* ── Section label (Управление) ── */
    .nav-section-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--nav-label-text);
      padding: 6px 18px 2px;
    }

    /* ── Collapsible group (Справочници) ── */
    .nav-group-header {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      color: var(--nav-text);
      border-left: 3px solid transparent;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      transition: background var(--t-fast), color var(--t-fast);
      user-select: none;
    }
    .nav-group-header:hover {
      background: var(--nav-bg-hover);
      color: var(--nav-text-hover);
    }
    .nav-group-header.active {
      background: var(--nav-bg-active);
      color: var(--nav-text-active);
      border-left-color: var(--nav-accent-active);
      font-weight: 500;
    }

    /* Arrow chevron for collapsible */
    .nav-arrow {
      margin-left: auto;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      transition: transform var(--t-med);
      line-height: 1;
    }
    .nav-arrow--open {
      transform: rotate(90deg);
    }

    /* Sub-items container */
    .nav-subitems {
      background: var(--nav-sub-bg);
      overflow: hidden;
    }
    .nav-subitem {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 16px 7px 26px;         /* deeper indent */
      color: var(--nav-sub-text);
      font-size: 13px;
      border-left: 3px solid transparent;
      transition: background var(--t-fast), color var(--t-fast);
      cursor: pointer;
    }
    .nav-subitem:hover {
      background: var(--nav-sub-bg-hover);
      color: var(--nav-sub-text-hover);
    }
    .nav-subitem.active {
      color: var(--c-peach);
      border-left-color: var(--c-coral);
      font-weight: 500;
    }

    /* ══════════════════════════════════════
       MAIN CONTENT AREA
    ══════════════════════════════════════ */
    .main-content {
      flex: 1;
      background: var(--content-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top bar */
    .topbar {
      background: var(--card-bg);
      border-bottom: 1px solid rgba(170, 118, 124, 0.15);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .topbar-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Page body */
    .page-body {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
    }

    /* Placeholder card (Dashboard is empty in Stage 1a) */
    .placeholder-card {
      background: var(--card-bg);
      border: 1.5px dashed rgba(170, 118, 124, 0.35);
      border-radius: var(--radius-md);
      padding: 48px 32px;
      text-align: center;
      color: var(--text-muted);
    }
    .placeholder-card h2 {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--c-mauve);
    }
    .placeholder-card p {
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div
  class="app-layout"
  x-data="{
    activeItem: 'tabulo',
    catalogOpen: false,
    setActive(item) { this.activeItem = item; }
  }"
>

  <!-- ════════════ SIDEBAR ════════════ -->
  <aside class="sidebar">

    <!-- Block A: Branding -->
    <div class="sidebar-brand">
      <span class="brand-appname">PDForge</span>
      <span class="brand-company">ДДД Про ЕООД</span>
    </div>

    <!-- Block B: Main navigation -->
    <nav class="sidebar-nav">

      <a class="nav-item" :class="{ active: activeItem === 'tabulo' }"
         @click="setActive('tabulo')">
        <span class="nav-text">Табло</span>
      </a>

      <a class="nav-item" :class="{ active: activeItem === 'protokoli' }"
         @click="setActive('protokoli')">
        <span class="nav-text">Протоколи</span>
      </a>

      <a class="nav-item" :class="{ active: activeItem === 'shabloni' }"
         @click="setActive('shabloni')">
        <span class="nav-text">Шаблони</span>
      </a>

      <a class="nav-item" :class="{ active: activeItem === 'ednokratni' }"
         @click="setActive('ednokratni')">
        <span class="nav-text">Еднократни обработки</span>
      </a>

      <a class="nav-item" :class="{ active: activeItem === 'spravki' }"
         @click="setActive('spravki')">
        <span class="nav-text">Справки</span>
      </a>

      <a class="nav-item" :class="{ active: activeItem === 'klienti' }"
         @click="setActive('klienti')">
        <span class="nav-text">Клиенти</span>
      </a>

      <a class="nav-item" :class="{ active: activeItem === 'obekti' }"
         @click="setActive('obekti')">
        <span class="nav-text">Обекти</span>
      </a>

      <a class="nav-item" :class="{ active: activeItem === 'etiketi' }"
         @click="setActive('etiketi')">
        <span class="nav-text">Етикети</span>
      </a>

    </nav>

    <!-- Block C: Management -->
    <div class="sidebar-management">

      <span class="nav-section-label">Управление</span>

      <!-- Collapsible: Справочници -->
      <div>
        <button
          class="nav-group-header"
          :class="{ active: activeItem === 'spravochnici' }"
          @click="catalogOpen = !catalogOpen; setActive('spravochnici')"
        >
          <span class="nav-text">Справочници</span>
          <span class="nav-arrow" :class="{ 'nav-arrow--open': catalogOpen }">›</span>
        </button>

        <div class="nav-subitems" x-show="catalogOpen" x-transition>
          <a class="nav-subitem" :class="{ active: activeItem === 'preparati' }"
             @click.stop="setActive('preparati')">
            <span>Препарати</span>
          </a>
          <a class="nav-subitem" :class="{ active: activeItem === 'rabotnici' }"
             @click.stop="setActive('rabotnici')">
            <span>Работници</span>
          </a>
          <a class="nav-subitem" :class="{ active: activeItem === 'firmi' }"
             @click.stop="setActive('firmi')">
            <span>Фирми</span>
          </a>
          <a class="nav-subitem" :class="{ active: activeItem === 'vrediteli' }"
             @click.stop="setActive('vrediteli')">
            <span>Вредители</span>
          </a>
          <a class="nav-subitem" :class="{ active: activeItem === 'nehim' }"
             @click.stop="setActive('nehim')">
            <span>Нехим. средства</span>
          </a>
        </div>
      </div>

      <a class="nav-item" :class="{ active: activeItem === 'baza' }"
         @click="setActive('baza')">
        <span class="nav-text">База данни</span>
      </a>

      <a class="nav-item" :class="{ active: activeItem === 'nastroiki' }"
         @click="setActive('nastroiki')">
        <span class="nav-text">Настройки</span>
      </a>

    </div>

    <!-- Block D: Version -->
    <div class="sidebar-version">v1.0.0</div>

  </aside>

  <!-- ════════════ MAIN CONTENT ════════════ -->
  <main class="main-content">

    <div class="topbar">
      <span class="topbar-title" x-text="{
        tabulo: 'Табло',
        protokoli: 'Протоколи',
        shabloni: 'Шаблони',
        ednokratni: 'Еднократни обработки',
        spravki: 'Справки',
        klienti: 'Клиенти',
        obekti: 'Обекти',
        etiketi: 'Етикети',
        spravochnici: 'Справочници',
        preparati: 'Препарати',
        rabotnici: 'Работници',
        firmi: 'Фирми',
        vrediteli: 'Вредители',
        nehim: 'Нехимични средства',
        baza: 'База данни',
        nastroiki: 'Настройки'
      }[activeItem]"></span>
    </div>

    <div class="page-body">
      <div class="placeholder-card">
        <h2>Страницата предстои</h2>
        <p>Съдържанието на тази секция ще бъде изградено<br>в съответния етап от разработката.</p>
      </div>
    </div>

  </main>

</div>

</body>
</html>
